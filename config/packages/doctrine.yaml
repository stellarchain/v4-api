doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
            statistics:
                url: '%env(resolve:default:app.default_statistics_database_url:DATABASE_STATISTICS_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
            external:
                url: '%env(resolve:DATABASE_URL_EXTERNAL)%'
                profiling_collect_backtrace: '%kernel.debug%'
            horizon:
                url: '%env(resolve:DATABASE_HORIZON_URL_TESTNET)%'
                profiling_collect_backtrace: '%kernel.debug%'
            horizon_testnet:
                url: '%env(resolve:DATABASE_HORIZON_URL_TESTNET)%'
                profiling_collect_backtrace: '%kernel.debug%'
            horizon_mainnet:
                url: '%env(resolve:DATABASE_HORIZON_URL_MAINNET)%'
                profiling_collect_backtrace: '%kernel.debug%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    # "TEST_TOKEN" is typically set by ParaTest
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
