---
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      STELLAR_ORDER_MONITOR_ACCOUNT_TESTNET: GDKZFOO6G47BYUYYU7JE6EW2HAQI2YG57VB2K3X4PVMHNODHAZV7TPA4
      STELLAR_ORDER_MONITOR_ACCOUNT_MAINNET: GAI3GJ2Q3B35AOZJ36C4ANE3HSS4NK7WI6DNO4ZSHRAX6NG7BMX6VJER
      STELLAR_HORIZON_MAINNET_URL: http://192.168.7.252:8000
      STELLAR_HORIZON_TESTNET_URL: http://192.168.7.251:8000
      STELLAR_HORIZON_FUTURENET_URL: https://horizon-futurenet.stellar.org
      SOROBAN_RPC_MAINNET_URL: http://192.168.7.253:8000/
      SOROBAN_RPC_TESTNET_URL: https://soroban-testnet.stellar.org
      SOROBAN_RPC_FUTURENET_URL: https://rpc-futurenet.stellar.org
      SOROBAN_RPC_BACKUP_MAINNET_URL: https://soroban-rpc.mainnet.stellar.gateway.fm
      DATABASE_HORIZON_URL_TESTNET: ${DATABASE_HORIZON_URL_TESTNET:-postgresql://horizon:!ChangeMe!@127.0.0.1:5432/horizon?serverVersion=14.0.0}
      DATABASE_STATISTICS_URL: ${DATABASE_STATISTICS_URL:-postgresql://horizon:!ChangeMe!@127.0.0.1:5432/horizon_statistics?serverVersion=14.0.0}
      DATABASE_HORIZON_URL_MAINNET: ${DATABASE_HORIZON_URL_MAINNET:-postgresql://horizon:!ChangeMe!@127.0.0.1:5432/horizon?serverVersion=14.0.0}
      #DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8}&charset=${MYSQL_CHARSET:-utf8mb4}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:!ChangeMe!@database:3306/app?serverVersion=8&charset=utf8mb4}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # The two next lines can be removed after initial installation
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      # You should definitely change the password in production
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
